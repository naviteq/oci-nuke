name: docs

# Build-only on pull requests: strict mode turns a broken internal link into a failed check,
# which is the only way a docs site stays correct once it has 60-odd generated pages.
#
# The site is served from the public mirror, naviteq/oci-nuke, and deploys there on every push to
# main -- which in the mirror means every merged `chore: mirror vX.Y.Z`, so the site always
# describes the latest public release. Anywhere else it only builds.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'pkg/config/schema/**'
      - 'tools/generate-config-docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The config reference is generated from the schema config validate uses. -check writes
      # nothing and fails if the committed page has drifted, so a schema change cannot land
      # without the documentation moving with it.
      - name: the config reference matches the schema
        run: go run ./tools/generate-config-docs -check
      - name: install the pinned docs toolchain
        run: pip install -r .github/docs-requirements.txt
      - name: build the site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.repository_owner == 'naviteq' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
