name: verify-release-image

# A green goreleaser run proves the push and sign commands exited 0. It does not prove the
# manifest list resolves, that the signature verifies, or that the arm64 half runs -- and this
# image is the artefact a stranger is most likely to pull. → docs/releasing.md
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to verify, with its v prefix.
        required: true
        type: string
  # checkov:skip=CKV_GHA_7: CKV_GHA_7 guards build-output integrity against user parameters.
  # This workflow builds and publishes nothing -- it reads an already-published image and exits
  # non-zero -- and the tag has to be nameable to verify a release that already shipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify, with its v prefix (e.g. v1.4.0).
        required: true
        type: string

permissions:
  contents: read

env:
  COSIGN_VERSION: v3.1.3
  IMAGE: ghcr.io/naviteq/oci-nuke

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      packages: read # pull the image and its signature from ghcr.io
    steps:
      - name: setup qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: setup docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sigstore/cosign-installer is not on this org's Actions allowlist, so the binary comes
      # from the upstream release archive at a pinned version, checksum-verified.
      - name: install cosign
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfLo /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -sSfLo /tmp/cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          EXPECTED=$(grep ' cosign-linux-amd64$' /tmp/cosign_checksums.txt | cut -d' ' -f1)
          echo "${EXPECTED}  /tmp/cosign" | sha256sum -c -
          install -m 0755 /tmp/cosign "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the manifest list carries both linux architectures
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${TAG}"

          # imagetools resolves the index rather than one image, so a tag that is secretly a
          # single-arch image shows up here as a missing platform instead of passing quietly.
          docker buildx imagetools inspect --raw "${ref}" > /tmp/index.json
          jq -r '.manifests[]? | "\(.platform.os)/\(.platform.architecture)"' /tmp/index.json \
            | grep -v '^unknown/unknown$' | sort -u > /tmp/platforms.txt
          echo "platforms in the index:"; cat /tmp/platforms.txt

          missing=()
          for want in linux/amd64 linux/arm64; do
            grep -qx "${want}" /tmp/platforms.txt || missing+=("${want}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${ref} is missing ${missing[*]} -- the multi-arch index did not publish as declared."
            exit 1
          fi
      - name: the image signature verifies against this repository's workflow identity
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The identity is pinned to this repository, not merely to "some GitHub Actions run":
          # accepting any Fulcio cert from the OIDC issuer would verify an image signed by
          # anyone's workflow.
          cosign verify "${IMAGE}:${TAG}" \
            --certificate-identity-regexp '^https://github\.com/naviteq/oci-nuke/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: the binary runs on both linux architectures
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # --platform against the index is what makes this a per-architecture check; without it
          # the runner pulls amd64 twice and the arm64 half stays untested.
          for platform in linux/amd64 linux/arm64; do
            echo "::group::${platform}"
            out="$(docker run --rm --platform "${platform}" "${IMAGE}:${TAG}" version)"
            echo "${out}"
            # The tag keeps its v prefix here: goreleaser builds with
            # -X ...common.Version=v{{ .Version }}, so the binary prints "oci-nuke v1.4.0".
            grep -q -- "${TAG}" <<<"${out}" \
              || { echo "::error::${platform} image does not report ${TAG}"; exit 1; }
            echo "::endgroup::"
          done
      - name: report the package's visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Advisory, not a gate: a private package on a public repository fails a stranger's
          # `docker pull` with an auth error that reads like their own mistake, but the fix is an
          # org setting and not something this run can or should change.
          if ! visibility="$(gh api /orgs/naviteq/packages/container/oci-nuke --jq .visibility 2>/dev/null)"; then
            echo "::notice::could not read the package's visibility with this token; check it by hand."
            exit 0
          fi
          repo_private="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .private)"
          echo "package visibility: ${visibility}; repository private: ${repo_private}"
          if [ "${visibility}" = "private" ] && [ "${repo_private}" = "false" ]; then
            echo "::warning::the repository is public but the package is private -- docker pull will fail for everyone but this org."
          fi
